<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" 
viewBox="0 0 900 600" font-family="Arial, sans-serif">

    <defs>
        <linearGradient id="carroceriaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#60A5FA"/>
            <stop offset="50%" style="stop-color:#3B82F6"/>
            <stop offset="100%" style="stop-color:#1D4ED8"/>
        </linearGradient>
        <linearGradient id="ventanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#BAE6FD"/>
            <stop offset="100%" style="stop-color:#7DD3FC"/>
        </linearGradient>
        <filter id="sombra3d">
            <feDropShadow dx="4" dy="4" stdDeviation="4" flood-opacity="0.3"/>
        </filter>
    </defs>
    

    <rect width="900" height="600" fill="#F8FAFC"/>
    <rect width="900" height="600" fill="url(#gridPattern)" opacity="0.1"/>
    

    <rect x="0" y="0" width="900" height="55" fill="#1E3A5F"/>
    <text x="25" y="35" fill="#FFFFFF" font-size="18" font-weight="bold">
        Diagrama WAD - Impacto Lateral - Zonas de Contacto Cabeza
    </text>
    

        <g transform="translate(320, 320)" filter="url(#sombra3d)">
            <!-- Sombra -->
            <ellipse cx="0" cy="100" rx="200" ry="20" fill="#00000015"/>

            <!-- Carroceria lateral -->
            <path d="M -180,60
                     L -150,50
                     L -100,30
                     L -60,-20
                     L 0,-50
                     L 80,-50
                     L 140,-20
                     L 180,30
                     L 180,60
                     L 180,80
                     L -180,80 Z"
                  fill="url(#carroceriaGrad)" stroke="#1D4ED8" stroke-width="2"/>

            <!-- Ventanas -->
            <path d="M -50,-15
                     L 0,-45
                     L 70,-45
                     L 120,-15
                     L 100,15
                     L -30,15 Z"
                  fill="url(#ventanaGrad)" stroke="#0EA5E9" stroke-width="1" opacity="0.85"/>

            <!-- Pilar B -->
            <line x1="30" y1="-45" x2="30" y2="15" stroke="#1D4ED8" stroke-width="4"/>

            <!-- Rueda trasera -->
            <circle cx="-120" cy="80" r="35" fill="#1F2937"/>
            <circle cx="-120" cy="80" r="25" fill="#374151"/>
            <circle cx="-120" cy="80" r="10" fill="#6B7280"/>

            <!-- Rueda delantera -->
            <circle cx="120" cy="80" r="35" fill="#1F2937"/>
            <circle cx="120" cy="80" r="25" fill="#374151"/>
            <circle cx="120" cy="80" r="10" fill="#6B7280"/>

            <!-- Faro -->
            <ellipse cx="175" cy="50" rx="12" ry="20" fill="#FEF3C7" stroke="#F59E0B"/>

            <!-- Manilla puerta -->
            <rect x="-10" y="10" width="25" height="5" fill="#1D4ED8" rx="2"/>
        </g>
        

        <line x1="50" y1="220.0" x2="600" y2="220.0"
              stroke="#10B981" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
        <text x="610" y="225.0" fill="#10B981" font-size="12" font-weight="bold">
            WAD 1000
        </text>
        <text x="30" y="225.0" fill="#6B7280" font-size="10" text-anchor="end">
            1.0m
        </text>
        

        <line x1="50" y1="170.0" x2="600" y2="170.0"
              stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
        <text x="610" y="175.0" fill="#F59E0B" font-size="12" font-weight="bold">
            WAD 1500
        </text>
        <text x="30" y="175.0" fill="#6B7280" font-size="10" text-anchor="end">
            1.5m
        </text>
        

        <line x1="50" y1="70.0" x2="600" y2="70.0"
              stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
        <text x="610" y="75.0" fill="#EF4444" font-size="12" font-weight="bold">
            WAD 2500
        </text>
        <text x="30" y="75.0" fill="#6B7280" font-size="10" text-anchor="end">
            2.5m
        </text>
        
<g id="marcadores-impacto">

        <g class="marcador-peaton-20">
            <polygon points="320.0,285.5 310.0,303.5 330.0,303.5"
                     fill="#22C55E" stroke="#111827" stroke-width="1.5"/>
            <text x="320.0" y="279.5" text-anchor="middle"
                  fill="#22C55E" font-size="12" font-weight="bold">
                20
            </text>
        </g>
        

            <g class="marcador-ciclista-20">
                <line x1="287.0" y1="282.5" x2="303.0" y2="282.5"
                      stroke="#7C3AED" stroke-width="3"/>
                <line x1="295.0" y1="274.5" x2="295.0" y2="290.5"
                      stroke="#7C3AED" stroke-width="3"/>
            </g>
            

        <g class="marcador-peaton-30">
            <polygon points="320.0,270.5 310.0,288.5 330.0,288.5"
                     fill="#84CC16" stroke="#111827" stroke-width="1.5"/>
            <text x="320.0" y="264.5" text-anchor="middle"
                  fill="#84CC16" font-size="12" font-weight="bold">
                30
            </text>
        </g>
        

            <g class="marcador-ciclista-30">
                <line x1="287.0" y1="267.5" x2="303.0" y2="267.5"
                      stroke="#7C3AED" stroke-width="3"/>
                <line x1="295.0" y1="259.5" x2="295.0" y2="275.5"
                      stroke="#7C3AED" stroke-width="3"/>
            </g>
            

        <g class="marcador-peaton-40">
            <polygon points="285.0,248.0 275.0,266.0 295.0,266.0"
                     fill="#F59E0B" stroke="#111827" stroke-width="1.5"/>
            <text x="285.0" y="242.0" text-anchor="middle"
                  fill="#F59E0B" font-size="12" font-weight="bold">
                40
            </text>
        </g>
        

            <g class="marcador-ciclista-40">
                <line x1="252.0" y1="245.0" x2="268.0" y2="245.0"
                      stroke="#7C3AED" stroke-width="3"/>
                <line x1="260.0" y1="237.0" x2="260.0" y2="253.0"
                      stroke="#7C3AED" stroke-width="3"/>
            </g>
            

        <g class="marcador-peaton-50">
            <polygon points="250.0,218.0 240.0,236.0 260.0,236.0"
                     fill="#EF4444" stroke="#111827" stroke-width="1.5"/>
            <text x="250.0" y="212.0" text-anchor="middle"
                  fill="#EF4444" font-size="12" font-weight="bold">
                50
            </text>
        </g>
        

            <g class="marcador-ciclista-50">
                <line x1="217.0" y1="215.0" x2="233.0" y2="215.0"
                      stroke="#7C3AED" stroke-width="3"/>
                <line x1="225.0" y1="207.0" x2="225.0" y2="223.0"
                      stroke="#7C3AED" stroke-width="3"/>
            </g>
            
</g>

        <g class="velocidad-destacada">
            <circle cx="250.0" cy="230.0" r="25" fill="none"
                    stroke="#DC2626" stroke-width="3">
                <animate attributeName="r" values="20;30;20" dur="1.5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
            </circle>
            <rect x="210.0" y="180.0" width="80" height="24"
                  fill="#DC2626" rx="4"/>
            <text x="250.0" y="197.0" text-anchor="middle"
                  fill="white" font-size="13" font-weight="bold">
                50 km/h
            </text>
        </g>
        

    <rect x="650" y="80" width="230" height="320"
          fill="white" stroke="#E5E7EB" stroke-width="1" rx="8"/>

    <text x="665" y="105" fill="#111827" font-size="14" font-weight="bold">
        Leyenda - Impacto Cabeza
    </text>

    <line x1="660" y1="115" x2="870" y2="115"
          stroke="#E5E7EB"/>

    <!-- Simbolo peaton -->
    <polygon points="675,130 665,148 685,148"
             fill="#F97316" stroke="#111827"/>
    <text x="700" y="143" fill="#374151" font-size="12">Peaton adulto</text>

    <!-- Simbolo ciclista -->
    <line x1="668" y1="170" x2="682" y2="170" stroke="#7C3AED" stroke-width="3"/>
    <line x1="675" y1="163" x2="675" y2="177" stroke="#7C3AED" stroke-width="3"/>
    <text x="700" y="175" fill="#374151" font-size="12">Ciclista</text>

    <line x1="660" y1="190" x2="870" y2="190"
          stroke="#E5E7EB"/>

    <text x="665" y="210" fill="#111827" font-size="12" font-weight="bold">
        Velocidad → Zona impacto:
    </text>
    

        <rect x="665" y="230" width="18" height="18" rx="3" fill="#22C55E"/>
        <text x="692" y="244" fill="#374151" font-size="12" font-weight="bold">
            20 km/h
        </text>
        <text x="755" y="244" fill="#6B7280" font-size="11">
            Puerta
        </text>
        

        <rect x="665" y="265" width="18" height="18" rx="3" fill="#84CC16"/>
        <text x="692" y="279" fill="#374151" font-size="12" font-weight="bold">
            30 km/h
        </text>
        <text x="755" y="279" fill="#6B7280" font-size="11">
            Ventana
        </text>
        

        <rect x="665" y="300" width="18" height="18" rx="3" fill="#F59E0B"/>
        <text x="692" y="314" fill="#374151" font-size="12" font-weight="bold">
            40 km/h
        </text>
        <text x="755" y="314" fill="#6B7280" font-size="11">
            Pilar B
        </text>
        

        <rect x="665" y="335" width="18" height="18" rx="3" fill="#EF4444"/>
        <text x="692" y="349" fill="#374151" font-size="12" font-weight="bold">
            50 km/h
        </text>
        <text x="755" y="349" fill="#6B7280" font-size="11">
            Techo
        </text>
        

    <line x1="660" y1="375" x2="870" y2="375"
          stroke="#E5E7EB"/>
    <text x="665" y="392" fill="#6B7280" font-size="9" font-style="italic">
        Basado en estudios ITRASA/Euro NCAP
    </text>
    

    <rect x="25" y="500" width="600" height="85" fill="#F8FAFC"
          stroke="#E5E7EB" stroke-width="1" rx="8"/>

    <text x="40" y="525" fill="#111827" font-size="13" font-weight="bold">
        Interpretacion - Impacto Lateral
    </text>

    <text x="40" y="545" fill="#374151" font-size="11">
        • 15-25 km/h: Impacto en capo - Lesiones moderadas (AIS 1-2)
    </text>
    <text x="40" y="562" fill="#374151" font-size="11">
        • 30-40 km/h: Impacto en parabrisas - Lesiones graves, TCE probable (AIS 3-4)
    </text>
    <text x="340" y="545" fill="#374151" font-size="11">
        • 45-55 km/h: Impacto en techo/pilar - Lesiones muy graves (AIS 5+)
    </text>
    <text x="340" y="562" fill="#374151" font-size="11">
        • &gt;55 km/h: Proyeccion completa - Riesgo vital muy alto
    </text>
    

    <text x="880" y="590" text-anchor="end" fill="#9CA3AF" font-size="9">
        Veridict AI - Reconstruccion Forense
    </text>
    
</svg>