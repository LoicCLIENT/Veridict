<line x1="450" y1="70" x2="450" y2="590" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>
<line x1="20" y1="190" x2="880" y2="190" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>
<line x1="560" y1="70" x2="560" y2="590" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>
<line x1="20" y1="80" x2="880" y2="80" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>
<line x1="670" y1="70" x2="670" y2="590" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>
<line x1="780" y1="70" x2="780" y2="590" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>

    <g class="huella-frenada">
        <line x1="118.8" y1="126.7" x2="316.8" y2="214.7"
