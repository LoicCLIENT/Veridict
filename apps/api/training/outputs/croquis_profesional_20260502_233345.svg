        <line x1="473.2" y1="297.2" x2="627.2" y2="363.2"
              stroke="#92400E" stroke-width="10"
              stroke-dasharray="4,2" stroke-linecap="round"
              opacity="0.6"/>
    </g>
    
<path d="M 54.0,80.0 L 230.0,168.0 L 450.0,300.0" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
<path d="M 670.0,410.0 L 516.0,344.0 L 450.0,300.0" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>

    <g class="pdi" filter="url(#glowPDI)">
