<path d="M-8,-2 L8,-2 L8,2 L-8,2 Z" fill="url(#vehiculoBGrad)" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="none"/>
<ellipse cx="-6" cy="0" rx="4" ry="3" fill="#111827" stroke="#374151" stroke-width="0.5"/>
<ellipse cx="6" cy="0" rx="4" ry="3" fill="#111827" stroke="#374151" stroke-width="0.5"/>
</g>
<text x="516.0" y="327.6" text-anchor="middle" fill="#DC2626" font-size="14" font-weight="bold" font-family="Arial, sans-serif">B</text>

    <g class="flecha-velocidad">
