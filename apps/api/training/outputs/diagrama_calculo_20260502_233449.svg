<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Arial, sans-serif">

    <defs>
        <!-- Gradiente de asfalto -->
        <linearGradient id="asfaltoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4B5563;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo A -->
        <linearGradient id="vehiculoAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo B -->
        <linearGradient id="vehiculoBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente velocidad (verde a rojo) -->
        <linearGradient id="velocidadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
        </linearGradient>

        <!-- Sombra drop shadow -->
        <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>

        <!-- Glow para PDI -->
        <filter id="glowPDI">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Patron de asfalto -->
        <pattern id="asfaltoPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#374151"/>
            <circle cx="3" cy="3" r="0.5" fill="#4B5563" opacity="0.5"/>
            <circle cx="13" cy="8" r="0.3" fill="#4B5563" opacity="0.5"/>
            <circle cx="7" cy="15" r="0.4" fill="#4B5563" opacity="0.5"/>
        </pattern>
    </defs>
    
<rect width="800" height="500" fill="#F9FAFB" rx="12"/>

    <rect x="0" y="0" width="800" height="50" fill="#1F2937" rx="12 12 0 0"/>
    <text x="20" y="32" fill="#C2E94B" font-size="16" font-weight="bold">
        Calculo de Velocidad por Huella de Frenada (Stannard-Baker)
    </text>
    

    <rect x="20" y="60" width="760" height="60" fill="white" rx="8"
          stroke="#C2E94B" stroke-width="2"/>
    <text x="400" y="98" text-anchor="middle" fill="#111827"
          font-size="18" font-family="'Times New Roman', serif" font-style="italic">
        v = √(2 · μ · g · d) → v = √(2 × 0.75 × 9.81 × 18.5)
    </text>
    

        <rect x="30" y="140" width="165" height="60" fill="#F3F4F6" rx="6"/>
        <text x="40" y="162" fill="#111827" font-size="12" font-weight="bold">
            μ (coef. friccion)
        </text>
        <text x="40" y="182" fill="#2563EB" font-size="16" font-weight="bold">
            0.75 
        </text>
        <text x="40" y="195" fill="#6B7280" font-size="9">
            Asfalto seco
        </text>
        

        <rect x="215" y="140" width="165" height="60" fill="#F3F4F6" rx="6"/>
        <text x="225" y="162" fill="#111827" font-size="12" font-weight="bold">
            g (gravedad)
        </text>
        <text x="225" y="182" fill="#2563EB" font-size="16" font-weight="bold">
            9.81 m/s²
        </text>
        <text x="225" y="195" fill="#6B7280" font-size="9">
            Constante
        </text>
        

        <rect x="400" y="140" width="165" height="60" fill="#F3F4F6" rx="6"/>
        <text x="410" y="162" fill="#111827" font-size="12" font-weight="bold">
            d (distancia huella)
        </text>
        <text x="410" y="182" fill="#2563EB" font-size="16" font-weight="bold">
            18.50 m
        </text>
        <text x="410" y="195" fill="#6B7280" font-size="9">
            Medida in situ
        </text>
        

        <rect x="585" y="140" width="165" height="60" fill="#F3F4F6" rx="6"/>
        <text x="595" y="162" fill="#111827" font-size="12" font-weight="bold">
            pendiente
        </text>
        <text x="595" y="182" fill="#2563EB" font-size="16" font-weight="bold">
            0.00 %
        </text>
        <text x="595" y="195" fill="#6B7280" font-size="9">
            Terreno llano
        </text>
        

        <text x="30" y="290" fill="#111827" font-size="13" font-weight="bold">
            Fases del proceso:
        </text>
        

            <rect x="30" y="305" width="231" height="80" fill="#F59E0B20"
                  rx="6" stroke="#F59E0B" stroke-width="1"/>
            <text x="40" y="325" fill="#F59E0B" font-size="11" font-weight="bold">
                Percepcion-Reaccion
            </text>
            <text x="40" y="345" fill="#111827" font-size="14" font-weight="bold">
                1.00 s
            </text>
            <text x="40" y="363" fill="#111827" font-size="12">
                16.50 m
            </text>
            <text x="40" y="377" fill="#6B7280" font-size="9">
                Tiempo standard 1s
            </text>
            

                <polygon points="266,345 274,350 266,355"
                         fill="#9CA3AF"/>
                

            <rect x="276" y="305" width="231" height="80" fill="#2563EB20"
                  rx="6" stroke="#2563EB" stroke-width="1"/>
            <text x="286" y="325" fill="#2563EB" font-size="11" font-weight="bold">
                Ejecucion Frenado
            </text>
            <text x="286" y="345" fill="#111827" font-size="14" font-weight="bold">
                0.30 s
            </text>
            <text x="286" y="363" fill="#111827" font-size="12">
                4.90 m
            </text>
            <text x="286" y="377" fill="#6B7280" font-size="9">
                Activacion sistema
            </text>
            

                <polygon points="512,345 520,350 512,355"
                         fill="#9CA3AF"/>
                

            <rect x="522" y="305" width="231" height="80" fill="#DC262620"
                  rx="6" stroke="#DC2626" stroke-width="1"/>
            <text x="532" y="325" fill="#DC2626" font-size="11" font-weight="bold">
                Frenada Efectiva
            </text>
            <text x="532" y="345" fill="#111827" font-size="14" font-weight="bold">
                2.25 s
            </text>
            <text x="532" y="363" fill="#111827" font-size="12">
                18.50 m
            </text>
            <text x="532" y="377" fill="#6B7280" font-size="9">
                Huella visible calzada
            </text>
            

    <rect x="20" y="410" width="760" height="70" fill="#C2E94B20"
          rx="8" stroke="#C2E94B" stroke-width="2"/>
    <text x="40" y="438" fill="#111827" font-size="14" font-weight="bold">
        RESULTADO:
    </text>
    <text x="40" y="462" fill="#1F2937" font-size="24" font-weight="bold">
        59.30 km/h
    </text>
    <text x="760" y="455" text-anchor="end" fill="#6B7280" font-size="12">
        Velocidad minima al inicio de la huella
    </text>
    
</svg>