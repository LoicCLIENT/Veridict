<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="Arial, sans-serif">

    <defs>
        <!-- Gradiente de asfalto -->
        <linearGradient id="asfaltoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4B5563;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo A -->
        <linearGradient id="vehiculoAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo B -->
        <linearGradient id="vehiculoBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente velocidad (verde a rojo) -->
        <linearGradient id="velocidadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
        </linearGradient>

        <!-- Sombra drop shadow -->
        <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>

        <!-- Glow para PDI -->
        <filter id="glowPDI">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Patron de asfalto -->
        <pattern id="asfaltoPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#374151"/>
            <circle cx="3" cy="3" r="0.5" fill="#4B5563" opacity="0.5"/>
            <circle cx="13" cy="8" r="0.3" fill="#4B5563" opacity="0.5"/>
            <circle cx="7" cy="15" r="0.4" fill="#4B5563" opacity="0.5"/>
        </pattern>
    </defs>
    
<rect width="700" height="500" fill="#F9FAFB" rx="12"/>

    <rect x="0" y="0" width="700" height="50" fill="#1F2937" rx="12 12 0 0"/>
    <text x="20" y="32" fill="#C2E94B" font-size="16" font-weight="bold">
        Diagrama Biomecanico WAD - Wrap Around Distance
    </text>
    

    <g transform="translate(100,340)">
        <!-- Carroceria -->
        <path d="M0,0 L20,-20 L40,-20 L60,-50 L180,-50 L200,-20 L220,-20 L250,0 Z"
              fill="url(#vehiculoAGrad)" stroke="#1D4ED8" stroke-width="2"/>
        <!-- Ruedas -->
        <ellipse cx="50" cy="0" rx="25" ry="20" fill="#1F2937"/>
        <ellipse cx="190" cy="0" rx="25" ry="20" fill="#1F2937"/>
        <!-- Parabrisas -->
        <line x1="60" y1="-50" x2="100" y2="-75" stroke="#60A5FA" stroke-width="3"/>
    </g>
    

    <g transform="translate(380,170.0)">
        <!-- Cabeza -->
        <circle cx="0" cy="0" r="15" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
        <!-- Cuerpo -->
        <line x1="0" y1="15" x2="0" y2="80" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
        <!-- Brazos -->
        <line x1="-25" y1="35" x2="25" y2="35" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
        <!-- Piernas -->
        <line x1="0" y1="80" x2="-20" y2="140" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
        <line x1="0" y1="80" x2="20" y2="140" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    </g>
    

    <g class="wad-measurement">
        <line x1="200" y1="290" x2="728.9" y2="180"
              stroke="#F59E0B" stroke-width="3" stroke-dasharray="8,4"/>
        <circle cx="728.9" cy="180" r="12" fill="#DC2626" opacity="0.8"/>
        <text x="728.9" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="bold">
            HEAD
        </text>
    </g>
    

    <rect x="550" y="80" width="180" height="280" fill="white" rx="8"
          stroke="#E5E7EB" stroke-width="1"/>

    <text x="565" y="110" fill="#111827" font-size="13" font-weight="bold">
        Datos del Impacto
    </text>

    <text x="565" y="140" fill="#6B7280" font-size="11">Velocidad:</text>
    <text x="715" y="140" fill="#DC2626" font-size="14"
          font-weight="bold" text-anchor="end">45 km/h</text>

    <text x="565" y="170" fill="#6B7280" font-size="11">WAD calculado:</text>
    <text x="715" y="170" fill="#C2E94B" font-size="14"
          font-weight="bold" text-anchor="end">10.58 m</text>

    <text x="565" y="200" fill="#6B7280" font-size="11">Altura peaton:</text>
    <text x="715" y="200" fill="#111827" font-size="12"
          text-anchor="end">1.70 m</text>

    <text x="565" y="230" fill="#6B7280" font-size="11">Altura capo:</text>
    <text x="715" y="230" fill="#111827" font-size="12"
          text-anchor="end">0.80 m</text>

    <line x1="565" y1="250" x2="715" y2="250"
          stroke="#E5E7EB" stroke-width="1"/>

    <text x="565" y="275" fill="#111827" font-size="11" font-weight="bold">
        Zona de contacto:
    </text>
    <text x="565" y="295" fill="#DC2626" font-size="12">
        Parabrisas/Techo
    </text>

    <text x="565" y="330" fill="#6B7280" font-size="9" font-style="italic">
        Formula: WAD = 0.0024V² +
    </text>
    <text x="565" y="345" fill="#6B7280" font-size="9" font-style="italic">
        0.127V + 0.003
    </text>
    

    <rect x="20" y="430" width="660" height="50" fill="#F3F4F6" rx="8"/>
    <text x="40" y="460" fill="#111827" font-size="11">
        El WAD (Wrap Around Distance) indica la distancia que recorre el cuerpo sobre el vehiculo
        durante el atropello, permitiendo estimar la zona de contacto cabeza-vehiculo.
    </text>
    
</svg>