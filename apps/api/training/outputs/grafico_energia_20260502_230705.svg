<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="Arial, sans-serif">

    <defs>
        <!-- Gradiente de asfalto -->
        <linearGradient id="asfaltoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4B5563;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo A -->
        <linearGradient id="vehiculoAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo B -->
        <linearGradient id="vehiculoBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente velocidad (verde a rojo) -->
        <linearGradient id="velocidadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
        </linearGradient>

        <!-- Sombra drop shadow -->
        <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>

        <!-- Glow para PDI -->
        <filter id="glowPDI">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Patron de asfalto -->
        <pattern id="asfaltoPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#374151"/>
            <circle cx="3" cy="3" r="0.5" fill="#4B5563" opacity="0.5"/>
            <circle cx="13" cy="8" r="0.3" fill="#4B5563" opacity="0.5"/>
            <circle cx="7" cy="15" r="0.4" fill="#4B5563" opacity="0.5"/>
        </pattern>
    </defs>
    
<rect width="700" height="400" fill="#F9FAFB" rx="12"/>

    <rect x="0" y="0" width="700" height="50" fill="#1F2937" rx="12 12 0 0"/>
    <text x="20" y="32" fill="#C2E94B" font-size="16" font-weight="bold">
        Energia Cinetica vs Velocidad - SEAT Ibiza (1150 kg)
    </text>
    <text x="680" y="32" fill="#9CA3AF" font-size="11" text-anchor="end">
        Masa: 1500 kg | Ec = 1/2 * m * v²
    </text>
    

    <line x1="80" y1="80" x2="80" y2="330"
          stroke="#374151" stroke-width="2"/>
    <text x="70" y="205" text-anchor="middle"
          fill="#6B7280" font-size="11" transform="rotate(-90,40,205)">
        Energia (kJ)
    </text>
    

    <line x1="80" y1="330" x2="660" y2="330"
          stroke="#374151" stroke-width="2"/>
    <text x="370" y="370" text-anchor="middle"
          fill="#6B7280" font-size="11">
        Velocidad (km/h)
    </text>
    

        <rect x="104.16666666666667" y="328.40277777777777" width="64.44444444444444" height="1.5972222222222217"
              fill="#22C55E" rx="4" opacity="0.9"/>

        <!-- Valor encima de la barra -->
        <text x="136.38888888888889" y="320.40277777777777" text-anchor="middle"
              fill="#111827" font-size="11" font-weight="bold">
            5.8 kJ
        </text>

        <!-- Velocidad debajo -->
        <text x="136.38888888888889" y="348" text-anchor="middle"
              fill="#111827" font-size="12" font-weight="bold">
            10
        </text>
        

        <rect x="200.83333333333334" y="315.625" width="64.44444444444444" height="14.375"
              fill="#22C55E" rx="4" opacity="0.9"/>

        <!-- Valor encima de la barra -->
        <text x="233.05555555555557" y="307.625" text-anchor="middle"
              fill="#111827" font-size="11" font-weight="bold">
            52.1 kJ
        </text>

        <!-- Velocidad debajo -->
        <text x="233.05555555555557" y="348" text-anchor="middle"
              fill="#111827" font-size="12" font-weight="bold">
            30
        </text>
        

        <rect x="297.50000000000006" y="290.06944444444446" width="64.44444444444444" height="39.93055555555555"
              fill="#F59E0B" rx="4" opacity="0.9"/>

        <!-- Valor encima de la barra -->
        <text x="329.7222222222223" y="282.06944444444446" text-anchor="middle"
              fill="#111827" font-size="11" font-weight="bold">
            144.7 kJ
        </text>

        <!-- Velocidad debajo -->
        <text x="329.7222222222223" y="348" text-anchor="middle"
              fill="#111827" font-size="12" font-weight="bold">
            50
        </text>
        

        <rect x="394.1666666666667" y="251.73611111111114" width="64.44444444444444" height="78.26388888888887"
              fill="#DC2626" rx="4" opacity="0.9"/>

        <!-- Valor encima de la barra -->
        <text x="426.3888888888889" y="243.73611111111114" text-anchor="middle"
              fill="#111827" font-size="11" font-weight="bold">
            283.6 kJ
        </text>

        <!-- Velocidad debajo -->
        <text x="426.3888888888889" y="348" text-anchor="middle"
              fill="#111827" font-size="12" font-weight="bold">
            70
        </text>
        

        <rect x="490.83333333333337" y="200.62500000000003" width="64.44444444444444" height="129.37499999999997"
              fill="#DC2626" rx="4" opacity="0.9"/>

        <!-- Valor encima de la barra -->
        <text x="523.0555555555555" y="192.62500000000003" text-anchor="middle"
              fill="#111827" font-size="11" font-weight="bold">
            468.8 kJ
        </text>

        <!-- Velocidad debajo -->
        <text x="523.0555555555555" y="348" text-anchor="middle"
              fill="#111827" font-size="12" font-weight="bold">
            90
        </text>
        

        <rect x="587.5" y="100.0" width="64.44444444444444" height="230.0"
              fill="#DC2626" rx="4" opacity="0.9"/>

        <!-- Valor encima de la barra -->
        <text x="619.7222222222222" y="92.0" text-anchor="middle"
              fill="#111827" font-size="11" font-weight="bold">
            833.3 kJ
        </text>

        <!-- Velocidad debajo -->
        <text x="619.7222222222222" y="348" text-anchor="middle"
              fill="#111827" font-size="12" font-weight="bold">
            120
        </text>
        

    <rect x="20" y="357" width="660" height="25" fill="#F3F4F6" rx="4"/>

    <rect x="40" y="365" width="12" height="12" fill="#22C55E" rx="2"/>
    <text x="58" y="375" fill="#6B7280" font-size="10">Baja (&lt;30 km/h)</text>

    <rect x="180" y="365" width="12" height="12" fill="#F59E0B" rx="2"/>
    <text x="198" y="375" fill="#6B7280" font-size="10">Media (30-60 km/h)</text>

    <rect x="340" y="365" width="12" height="12" fill="#DC2626" rx="2"/>
    <text x="358" y="375" fill="#6B7280" font-size="10">Alta (&gt;60 km/h)</text>
    
</svg>