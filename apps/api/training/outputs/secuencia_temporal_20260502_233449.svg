<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Arial, sans-serif">

    <defs>
        <!-- Gradiente de asfalto -->
        <linearGradient id="asfaltoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4B5563;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo A -->
        <linearGradient id="vehiculoAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente vehiculo B -->
        <linearGradient id="vehiculoBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
        </linearGradient>

        <!-- Gradiente velocidad (verde a rojo) -->
        <linearGradient id="velocidadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
        </linearGradient>

        <!-- Sombra drop shadow -->
        <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>

        <!-- Glow para PDI -->
        <filter id="glowPDI">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Patron de asfalto -->
        <pattern id="asfaltoPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#374151"/>
            <circle cx="3" cy="3" r="0.5" fill="#4B5563" opacity="0.5"/>
            <circle cx="13" cy="8" r="0.3" fill="#4B5563" opacity="0.5"/>
            <circle cx="7" cy="15" r="0.4" fill="#4B5563" opacity="0.5"/>
        </pattern>
    </defs>
    
<rect width="1000" height="300" fill="#F9FAFB" rx="12"/>

    <rect x="0" y="0" width="1000" height="40" fill="#1F2937" rx="12 12 0 0"/>
    <text x="20" y="26" fill="#C2E94B" font-size="14" font-weight="bold">
        Secuencia del Atropello - Analisis Temporal
    </text>
    

    <line x1="40" y1="260" x2="960" y2="260"
          stroke="#374151" stroke-width="3"/>
    

        <rect x="40" y="60" width="168" height="180" fill="#374151" rx="6"/>
        <text x="124" y="80" text-anchor="middle" fill="white" font-size="11" font-weight="bold">
            t = 0 ms
        </text>
        

            <rect x="97.0" y="142" width="24" height="16"
                  fill="#2563EB" rx="3" transform="rotate(20,109.0,150)"/>
            

            <rect x="127.0" y="142" width="24" height="16"
                  fill="#DC2626" rx="3" transform="rotate(-90,139.0,150)"/>
            

        <circle cx="124" cy="260" r="8" fill="#C2E94B"/>
        <text x="124" y="280" text-anchor="middle" fill="#6B7280" font-size="9">
            Pre-impacto
        </text>
        

            <line x1="213" y1="150" x2="223" y2="150"
                  stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
            

        <rect x="228" y="60" width="168" height="180" fill="#374151" rx="6"/>
        <text x="312" y="80" text-anchor="middle" fill="white" font-size="11" font-weight="bold">
            t = 80 ms
        </text>
        

            <rect x="285.0" y="142" width="24" height="16"
                  fill="#2563EB" rx="3" transform="rotate(25,297.0,150)"/>
            

            <rect x="315.0" y="142" width="24" height="16"
                  fill="#DC2626" rx="3" transform="rotate(-70,327.0,150)"/>
            

        <circle cx="312" cy="260" r="8" fill="#C2E94B"/>
        <text x="312" y="280" text-anchor="middle" fill="#6B7280" font-size="9">
            Contacto inicia
        </text>
        

            <line x1="401" y1="150" x2="411" y2="150"
                  stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
            

        <rect x="416" y="60" width="168" height="180" fill="#374151" rx="6"/>
        <text x="500" y="80" text-anchor="middle" fill="white" font-size="11" font-weight="bold">
            t = 150 ms
        </text>
        

            <rect x="473.0" y="142" width="24" height="16"
                  fill="#2563EB" rx="3" transform="rotate(35,485.0,150)"/>
            

            <rect x="503.0" y="142" width="24" height="16"
                  fill="#DC2626" rx="3" transform="rotate(-45,515.0,150)"/>
            

        <circle cx="500" cy="260" r="8" fill="#C2E94B"/>
        <text x="500" y="280" text-anchor="middle" fill="#6B7280" font-size="9">
            Pico impacto
        </text>
        

            <line x1="589" y1="150" x2="599" y2="150"
                  stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
            

        <rect x="604" y="60" width="168" height="180" fill="#374151" rx="6"/>
        <text x="688" y="80" text-anchor="middle" fill="white" font-size="11" font-weight="bold">
            t = 300 ms
        </text>
        

            <rect x="661.0" y="142" width="24" height="16"
                  fill="#2563EB" rx="3" transform="rotate(40,673.0,150)"/>
            

            <rect x="691.0" y="142" width="24" height="16"
                  fill="#DC2626" rx="3" transform="rotate(-20,703.0,150)"/>
            

        <circle cx="688" cy="260" r="8" fill="#C2E94B"/>
        <text x="688" y="280" text-anchor="middle" fill="#6B7280" font-size="9">
            Separacion
        </text>
        

            <line x1="777" y1="150" x2="787" y2="150"
                  stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
            

        <rect x="792" y="60" width="168" height="180" fill="#374151" rx="6"/>
        <text x="876" y="80" text-anchor="middle" fill="white" font-size="11" font-weight="bold">
            t = 800 ms
        </text>
        

            <rect x="849.0" y="142" width="24" height="16"
                  fill="#2563EB" rx="3" transform="rotate(45,861.0,150)"/>
            

            <rect x="879.0" y="142" width="24" height="16"
                  fill="#DC2626" rx="3" transform="rotate(0,891.0,150)"/>
            

        <circle cx="876" cy="260" r="8" fill="#C2E94B"/>
        <text x="876" y="280" text-anchor="middle" fill="#6B7280" font-size="9">
            Pos. final
        </text>
        
</svg>