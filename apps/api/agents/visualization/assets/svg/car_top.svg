<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <!-- Car Top View - Turismo Generico -->
  <!-- ViewBox: width=100 (represents ~1.75m), height=200 (represents ~4.3m) -->

  <!-- Car Body -->
  <rect x="5" y="10" width="90" height="180" rx="15" ry="25" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>

  <!-- Hood Section -->
  <rect x="12" y="15" width="76" height="50" rx="10" ry="10" fill="#374151"/>

  <!-- Windshield -->
  <rect x="15" y="68" width="70" height="30" rx="5" ry="5" fill="#93C5FD" stroke="#1F2937" stroke-width="1"/>

  <!-- Roof -->
  <rect x="12" y="100" width="76" height="45" rx="5" ry="5" fill="#6B7280"/>

  <!-- Rear Window -->
  <rect x="15" y="148" width="70" height="22" rx="5" ry="5" fill="#93C5FD" stroke="#1F2937" stroke-width="1"/>

  <!-- Trunk -->
  <rect x="12" y="172" width="76" height="15" rx="8" ry="5" fill="#374151"/>

  <!-- Front Wheels -->
  <rect x="0" y="30" width="10" height="30" rx="3" fill="#1F2937"/>
  <rect x="90" y="30" width="10" height="30" rx="3" fill="#1F2937"/>

  <!-- Rear Wheels -->
  <rect x="0" y="145" width="10" height="30" rx="3" fill="#1F2937"/>
  <rect x="90" y="145" width="10" height="30" rx="3" fill="#1F2937"/>

  <!-- Side Mirrors -->
  <ellipse cx="2" cy="75" rx="4" ry="6" fill="#374151"/>
  <ellipse cx="98" cy="75" rx="4" ry="6" fill="#374151"/>

  <!-- Headlights -->
  <rect x="15" y="12" width="20" height="6" rx="2" fill="#FEF08A"/>
  <rect x="65" y="12" width="20" height="6" rx="2" fill="#FEF08A"/>

  <!-- Taillights -->
  <rect x="15" y="185" width="20" height="5" rx="2" fill="#DC2626"/>
  <rect x="65" y="185" width="20" height="5" rx="2" fill="#DC2626"/>
</svg>
