<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 145" width="430" height="145">
  <!-- Car Side View - Turismo Generico -->
  <!-- ViewBox: width=430 (~4.3m), height=145 (~1.45m) - Real proportions -->
  <!-- Origin bottom-left, car facing right -->

  <!-- Ground line reference -->
  <line x1="0" y1="143" x2="430" y2="143" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Wheels -->
  <circle cx="85" cy="120" r="25" fill="#1F2937" stroke="#374151" stroke-width="3"/>
  <circle cx="85" cy="120" r="12" fill="#6B7280"/>
  <circle cx="85" cy="120" r="4" fill="#374151"/>

  <circle cx="340" cy="120" r="25" fill="#1F2937" stroke="#374151" stroke-width="3"/>
  <circle cx="340" cy="120" r="12" fill="#6B7280"/>
  <circle cx="340" cy="120" r="4" fill="#374151"/>

  <!-- Car Body - Main shape -->
  <path d="
    M 30 95
    L 30 85
    Q 30 75, 40 70
    L 100 65
    L 120 65
    L 145 30
    Q 150 20, 170 18
    L 280 15
    Q 300 15, 310 25
    L 340 60
    L 395 65
    Q 410 65, 415 75
    L 420 90
    Q 422 95, 420 100
    L 400 100
    L 400 95
    Q 385 95, 365 95
    L 365 100
    L 55 100
    L 55 95
    Q 45 95, 30 95
    Z
  " fill="#4B5563" stroke="#1F2937" stroke-width="2"/>

  <!-- Hood -->
  <path d="
    M 40 70
    L 100 65
    L 120 65
    L 145 30
    Q 147 26, 145 30
    L 100 68
    L 45 73
    Q 40 74, 40 70
  " fill="#374151"/>

  <!-- Windshield -->
  <path d="
    M 147 30
    Q 150 22, 168 20
    L 195 18
    L 195 62
    L 150 62
    L 147 30
    Z
  " fill="#93C5FD" stroke="#1F2937" stroke-width="1"/>

  <!-- Roof -->
  <path d="
    M 195 18
    L 275 16
    Q 295 16, 305 28
    L 315 40
    L 195 40
    L 195 18
    Z
  " fill="#6B7280" stroke="#1F2937" stroke-width="1"/>

  <!-- Side windows -->
  <rect x="198" y="42" width="45" height="22" rx="2" fill="#93C5FD" stroke="#1F2937" stroke-width="1"/>
  <rect x="248" y="42" width="45" height="22" rx="2" fill="#93C5FD" stroke="#1F2937" stroke-width="1"/>

  <!-- Rear window -->
  <path d="
    M 305 30
    L 315 40
    L 330 55
    L 295 55
    L 295 42
    L 305 30
    Z
  " fill="#93C5FD" stroke="#1F2937" stroke-width="1"/>

  <!-- Trunk -->
  <path d="
    M 330 55
    L 340 60
    L 395 65
    Q 405 66, 410 72
    L 400 72
    L 335 68
    L 330 55
    Z
  " fill="#374151"/>

  <!-- Rear section -->
  <path d="
    M 395 65
    Q 410 65, 415 75
    L 420 90
    Q 420 95, 418 98
    L 400 98
    L 400 72
    L 395 65
    Z
  " fill="#4B5563" stroke="#1F2937" stroke-width="1"/>

  <!-- Headlight -->
  <ellipse cx="25" cy="80" rx="8" ry="5" fill="#FEF08A" stroke="#1F2937" stroke-width="1"/>

  <!-- Taillight -->
  <rect x="412" y="78" width="8" height="12" rx="2" fill="#DC2626" stroke="#1F2937" stroke-width="1"/>

  <!-- Front bumper -->
  <rect x="15" y="88" width="20" height="10" rx="3" fill="#374151" stroke="#1F2937" stroke-width="1"/>

  <!-- Rear bumper -->
  <rect x="405" y="88" width="18" height="10" rx="3" fill="#374151" stroke="#1F2937" stroke-width="1"/>

  <!-- Door handles -->
  <rect x="180" y="58" width="12" height="3" rx="1" fill="#6B7280"/>
  <rect x="265" y="58" width="12" height="3" rx="1" fill="#6B7280"/>

  <!-- Side mirror -->
  <ellipse cx="135" cy="55" rx="8" ry="5" fill="#374151" stroke="#1F2937" stroke-width="1"/>

  <!-- Wheel arches (shadow) -->
  <path d="M 50 95 Q 60 100, 85 100 Q 110 100, 120 95" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M 305 95 Q 320 100, 340 100 Q 360 100, 375 95" fill="none" stroke="#374151" stroke-width="2"/>
</svg>
