<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .diagram {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    /* Boxes */
    .box {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      text-align: center;
      min-width: 100px;
    }

    .box-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Arrow */
    .arrow {
      display: flex;
      align-items: center;
    }

    .arrow-line {
      width: 32px;
      height: 2px;
      background: #ccc;
    }

    .arrow-head {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid #ccc;
    }

    /* Pipeline container */
    .pipeline {
      background: #fafafa;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pipeline-label {
      font-size: 10px;
      font-weight: 600;
      color: #999;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .agents-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .agent {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px 16px;
      text-align: center;
    }

    .agent-num {
      font-size: 9px;
      font-weight: 600;
      color: #7cb62a;
      margin-bottom: 4px;
    }

    .agent-name {
      font-size: 12px;
      font-weight: 500;
      color: #333;
    }

    .mini-arrow {
      color: #ccc;
      font-size: 14px;
    }

    /* Output */
    .output {
      background: #C2E94B;
      border: none;
      border-radius: 8px;
      padding: 18px 24px;
      text-align: center;
    }

    .output-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .output-sub {
      font-size: 10px;
      color: #333;
      opacity: 0.7;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="diagram">
    <!-- Inputs -->
    <div class="box-group">
      <div class="box">Police Report</div>
      <div class="box">Photos</div>
      <div class="box">EDR Data</div>
    </div>

    <div class="arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <!-- Pipeline -->
    <div class="pipeline">
      <div class="pipeline-label">AI Pipeline</div>
      <div class="agents-row">
        <div class="agent">
          <div class="agent-num">01</div>
          <div class="agent-name">Parser</div>
        </div>
        <span class="mini-arrow">→</span>
        <div class="agent">
          <div class="agent-num">02</div>
          <div class="agent-name">Physics</div>
        </div>
        <span class="mini-arrow">→</span>
        <div class="agent">
          <div class="agent-num">03</div>
          <div class="agent-name">Timeline</div>
        </div>
        <span class="mini-arrow">→</span>
        <div class="agent">
          <div class="agent-num">04</div>
          <div class="agent-name">Validator</div>
        </div>
        <span class="mini-arrow">→</span>
        <div class="agent">
          <div class="agent-num">05</div>
          <div class="agent-name">Report</div>
        </div>
      </div>
    </div>

    <div class="arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <!-- Output -->
    <div class="output">
      <div class="output-title">Forensic Report</div>
      <div class="output-sub">UNE-EN 16775</div>
    </div>
  </div>
</body>
</html>
